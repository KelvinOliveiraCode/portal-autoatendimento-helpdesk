<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal de Autoatendimento — Helpdesk TI{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 1rem; line-height: 1.5; color: #111; }
    .container { max-width: 700px; margin: 0 auto; }
    header { border-bottom: 1px solid #ccc; padding-bottom: 0.75rem; margin-bottom: 1rem; }
    header a { color: #666; margin-right: 1rem; font-size: 0.9rem; }
    header a:hover { color: #111; }
    h1 { font-size: 1.25rem; margin: 0; }
    h2 { font-size: 1.1rem; margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; font-size: 0.95rem; }
    th { background: #f5f5f5; }
    .badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 0.35rem; font-size: 0.8rem; font-weight: 600; }
    .badge.aberto { background: #fff4d6; color: #856200; border: 1px solid #e3c96a; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; align-items: end; margin-top: 0.5rem; }
    input, select, textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 0.3rem; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
    textarea { grid-column: 1 / -1; min-height: 8rem; resize: vertical; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 0.3rem; background: #111; color: #fff; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #333; }
    a { color: #1a4ea6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .flash { padding: 0.6rem 0.9rem; border-radius: 0.3rem; margin-bottom: 1rem; font-size: 0.95rem; }
    .flash.sucesso { background: #e7f4e7; border: 1px solid #a7c9a7; color: #1c5a1c; }
    .flash.erro { background: #fbe7e7; border: 1px solid #c9a7a7; color: #5a1c1c; }
    .back { margin-top: 1rem; display: inline-block; }
    .vazio { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Portal de Autoatendimento — Helpdesk TI</h1>
      <a href="{{ url_for('helpdesk.index') }}">Início</a>
      <a href="{{ url_for('helpdesk.listar_tickets_route') }}">Todos os tickets</a>
      <a href="{{ url_for('helpdesk.novo_ticket') }}">Abrir ticket</a>
    </header>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
