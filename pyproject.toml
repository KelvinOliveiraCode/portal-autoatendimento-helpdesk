[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-autoatendimento-helpdesk"
version = "0.1.0"
description = "Portal de autoatendimento de helpdesk TI (Flask + SQLite)"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
